  :root{
    --navy:#0D1F2D; --navy-soft:#16303F; --slate:#546A7B; --grey:#9EA3B0;
    --blush:#FAE1DF; --nude:#E4C3AD; --off:#FAF8F5; --paper:#FFFDFB; --ink:#16232E;
    --lav:#DED6DF;
    --serif:'CG', ui-serif, Georgia, serif;
    --script:'Script', cursive;
    --sans:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{width:100%;min-height:100%;margin:0;padding:0;}
  body{
    font-family:var(--sans); background:var(--off); color:var(--ink);
    overflow-x:hidden;
  }
  button{font-family:inherit;}
  a{color:inherit;}
  ::selection{ background:var(--nude); color:var(--navy); }
  :focus-visible{ outline:2px solid var(--navy); outline-offset:2px; border-radius:4px; }

  #frame{
    width:100%; min-height:100dvh; background:var(--off);
    display:flex; flex-direction:column; position:relative;
  }
  /* This is a phone-only interface: on wider screens, keep it at a
     comfortable phone-like reading width instead of stretching the
     layout thin and sparse. No frame chrome (no border/shadow/radius/
     background change) — just a narrower column, same as any normal
     website with side margins. */
  @media (min-width:641px){

  function renderVoteHub() {
    var cats = ["All", "Events", "Improvements", "Returning"];

    var typeChips = Object.keys(voteTypeLabel).map(function (k) {
      return '<div style="border-bottom:1px solid rgba(158,163,176,.25);padding:12px 0;"><p style="font-size:14.5px;font-weight:500;color:var(--navy);">' + voteTypeLabel[k] + '</p><p style="font-size:13px;color:var(--slate);margin-top:4px;line-height:1.5;">' + voteTypes[k] + '</p></div>';
    }).join("");

    return '<div class="px" style="padding-top:28px;">' +
      '<p class="eyebrow">Community Hub</p><h1 style="font-size:32px;font-weight:600;margin-top:6px;">Vote</h1>' +
      '<p style="font-family:var(--serif);font-style:italic;font-size:14.5px;color:var(--slate);margin-top:4px;">What should happen next?</p></div>' +
      '<div class="chiprow" style="margin-top:16px;">' + chips + '</div>' +
      '<div class="px" style="margin-top:20px;" id="voteList">' + voteListHtml(Object.keys(votes)) + '</div>' +

      '<h2 style="font-size:20px;font-weight:500;">What kind of vote is this?</h2>' +
      '<div class="card" style="margin-top:10px;padding:0 16px;">' + typeChips + '</div></div>';
  }

  function voteListHtml(keys) {
    if (!keys.length) return '<div class="card" style="text-align:center;padding:32px 20px;border-style:dashed;"><p style="font-size:14.5px;color:var(--slate);">No votes match this filter.</p></div>';
    return keys.map(function (key) {
      var v = votes[key];
      return '<a class="card" data-go="vote-detail" data-vote="' + key + '" style="display:block;text-decoration:none;margin-bottom:12px;">' +
        '<p class="eyebrow">' + v.category + '</p>' +
        '<h3 style="font-size:19px;font-weight:500;margin-top:8px;line-height:1.3;">' + v.question + '</h3>' +
        '<div style="margin-top:10px;">' + voteTypeBadge(v.type) + '</div>' +
        '<p style="font-size:12.5px;color:var(--slate);margin-top:10px;">' + clockIcon() + ' ' + v.deadline + ' &nbsp; ' + v.votes + ' votes</p>' +
        '<p style="font-size:13px;font-weight:600;color:var(--navy);margin-top:10px;">Open this vote →</p></a>';
    }).join("");
  }

  function filterVotes() {
    var activeChip = document.querySelector("#view-vote .chiprow .chip.active");
    var cat = activeChip ? activeChip.getAttribute("data-cat") : "All";
    var keys = Object.keys(votes).filter(function (key) {
      return cat === "All" || votes[key].filterCat === cat;
    });
    var listEl = document.getElementById("voteList");
    listEl.innerHTML = voteListHtml(keys);
    wireSupportButtons("vote", listEl);
  }

  function renderVoteDetail(voteId) {
    var v = votes[voteId] || votes["next-up-october"];
    var submitted = state.votes[v.id];

    if (submitted) {
      var chosen = v.options.filter(function (o) { return submitted.indexOf(o.id) > -1; });
      return '<div class="px fade" style="padding-top:24px;">' +
        '<p class="eyebrow">' + v.eyebrow + '</p>' +
        '<h1 style="font-size:29px;font-weight:600;margin-top:14px;">Your Vote Is In.</h1>' +
        '<p style="font-size:14.5px;color:var(--slate);margin-top:8px;line-height:1.5;">Results will be revealed when voting closes.</p>' +
        '<div class="card" style="margin-top:22px;">' +
        '<p class="eyebrow">Your selection</p>' +
        '<div style="margin-top:8px;">' + chosen.map(function (o) { return '<p style="font-size:15px;color:var(--navy);margin-top:6px;display:flex;gap:8px;align-items:center;">' + checkIcon() + o.title + '</p>'; }).join("") + '</div></div>' +
        '<button class="btn-text" id="changeVote" style="margin-top:14px;">Change my vote</button>' +
        '<div style="display:flex;flex-direction:column;gap:10px;margin-top:26px;">' +
        '<button class="btn btn-primary" data-go="vote">View Other Votes</button>' +
        '<button class="btn-text" data-go="home">Return Home</button></div></div>';

        '<span class="dot"></span>' +
        '<span><h4>' + o.title + '</h4><p>' + o.desc + '</p></span></label>';
    }).join("");

    return '<div class="px" style="padding-top:14px;"><button class="btn-text" data-go="vote">← Back to Vote</button></div>' +
      '<div class="px" style="padding-top:14px;">' +
      '<p class="eyebrow">' + v.eyebrow + '</p>' +
      '<h1 style="font-size:27px;font-weight:600;margin-top:8px;line-height:1.2;">' + v.question + '</h1>' +
      '<p style="font-size:14.5px;color:var(--slate);margin-top:12px;line-height:1.5;">' + v.intro + '</p>' +
      '<div style="margin-top:14px;">' + voteTypeBadge(v.type) + '</div></div>' +
      '<div class="px" style="display:flex;flex-direction:column;gap:12px;margin-top:18px;" id="optList" data-vote="' + v.id + '">' + opts + '</div>' +
      '<div class="subbar"><button class="btn btn-primary" id="submitVote" style="width:100%;" disabled>Submit My Vote</button></div>';
  }

  function renderIdeas() {
    var cats = ["All", "Avatar", "Fashion", "Social", "Apartments", "Safety"];

      '<h1 style="font-size:32px;font-weight:600;">Ideas</h1>' +
      '<p style="font-family:var(--script);font-size:19px;color:var(--navy);margin-top:-4px;">from the community</p>' +

  function ideaListHtml(list) {

  function filterIdeas() {
    var q = (document.getElementById("ideaSearch").value || "").toLowerCase().trim();
    var activeChip = document.querySelector("#view-ideas .chiprow .chip.active");
    var cat = activeChip ? activeChip.getAttribute("data-cat") : "All";
    var list = ideas.filter(function (i) {
      var catMatch = cat === "All" || i.cat === cat;
      var qMatch = !q || i.title.toLowerCase().indexOf(q) > -1 || i.summary.toLowerCase().indexOf(q) > -1;
      return catMatch && qMatch;
    });
    var listEl = document.getElementById("ideaList");
    listEl.innerHTML = ideaListHtml(list);
    wireSupportButtons("ideas", listEl);
  }

  function ideaCard(i) {
    var supported = state.supported.indexOf(i.id) > -1;
    var count = i.supporters + (supported ? 1 : 0);
    return '<div class="card" style="margin-bottom:12px;" data-idea="' + i.id + '">' +
      '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">' +
      '<a data-go="idea-detail" data-idea="' + i.id + '" style="text-decoration:none;"><h3 style="font-size:18px;font-weight:500;line-height:1.3;">' + i.title + '</h3></a>' +
      statusPill(i.status, i.statusTone === "pos") + '</div>' +
      '<p style="font-size:14px;color:var(--slate);margin-top:8px;line-height:1.5;">' + i.summary + '</p>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;">' +
      '<span style="font-size:13px;color:var(--grey);" class="supporterCount">' + count.toLocaleString() + ' supporters</span>' +

      '<button class="btn supportBtn' + (supported ? "" : " btn-primary") + '" data-support="' + d.id + '" style="' + (supported ? "background:var(--navy);color:var(--off);" : "border:1px solid rgba(84,106,123,.4);background:transparent;color:var(--navy);") + 'display:inline-flex;align-items:center;gap:6px;">' + heartIcon(supported) + (supported ? "Supporting" : "Support Idea") + '</button></div>' +

      '<div><p style="font-family:var(--serif);font-size:21px;font-weight:600;color:var(--navy);">Community Member</p><p style="font-size:13px;color:var(--slate);margin-top:2px;">' + (Object.keys(state.votes).length + state.supported.length) + ' local interactions on this device</p></div></div>' +
      '<h2 style="font-size:20px;font-weight:500;margin-top:28px;">Preferences</h2>' +
      '<div class="card" style="margin-top:12px;padding:0 16px;">' + toggleRows + '</div></div>';
  }

  function renderTransparency() {
    var rows = transparency.map(function (t) {
      return '<div class="card" style="margin-bottom:14px;">' +
        '<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;">' +
        '<div><p style="font-family:var(--serif);font-size:19px;font-weight:500;">' + t.title + '</p><p style="font-size:12.5px;color:var(--grey);margin-top:3px;">' + t.pct + '% supported · Prototype data</p></div>' +
        statusPill(t.status, t.tone === "pos") + '</div>' +
        '<p style="font-size:14px;color:var(--slate);margin-top:10px;line-height:1.5;">' + t.note + '</p></div>';
    }).join("");

    return '<section class="grain px" style="background:var(--navy);color:var(--off);padding:30px 20px;position:relative;overflow:hidden;">' +
      '<div class="halo halo-cool" style="width:190px;height:190px;right:-60px;top:-60px;opacity:.4;"></div>' +
      '<span style="color:var(--nude);position:relative;">' + starMark() + '</span>' +
      '<p class="eyebrow" style="color:rgba(250,248,245,.6);margin-top:12px;">Transparency</p>' +
      '<h1 style="font-size:30px;font-weight:600;color:var(--off);margin-top:6px;line-height:1.15;">What Happened<br>After the Vote?</h1>' +
      '<p style="font-size:14px;color:rgba(250,248,245,.75);margin-top:14px;line-height:1.5;max-width:34ch;">A community should be able to see not only what it was asked — but what happened after it answered.</p></section>' +
      '<div class="px" style="padding-top:24px;">' + rows +
      '<div class="card" style="background:rgba(250,225,223,.25);"><p style="font-family:var(--serif);font-style:italic;font-size:15px;color:var(--navy);">&ldquo;Participation should have a paper trail.&rdquo;</p></div></div>';
  }

  function renderAbout() {
    var steps = [
      "A question or proposal is published.", "The community votes or supports it.",
      "The result is documented.", "Its status can continue to be followed.",
      "If something does not move forward, an explanation can still be recorded."
    ];
    var principles = [
      "One vote per eligible account.", "No paid voting.", "No VIP vote multiplier.",
      "No creator or influencer multiplier.", "Bot and spam protection, applied consistently.",
      "Results are released publicly.", "Randomised option order, where appropriate.",
      "“None of these” as a choice, where appropriate."
    ];
    var stepRows = steps.map(function (s, i) {
      return '<div style="display:flex;gap:12px;margin-top:16px;"><span style="font-family:var(--serif);font-size:19px;font-weight:500;color:var(--nude);width:26px;">' + ("0" + (i + 1)) + '</span><p style="font-size:14.5px;line-height:1.5;padding-top:1px;">' + s + '</p></div>';
    }).join("");
    var principleRows = principles.map(function (p) {
      return '<li style="display:flex;gap:10px;margin-top:10px;font-size:14px;line-height:1.5;"><span style="width:5px;height:5px;border-radius:50%;background:var(--slate);margin-top:8px;flex-shrink:0;"></span>' + p + '</li>';
    }).join("");

    return '<div class="px" style="padding-top:28px;">' +
      '<p class="eyebrow">About</p><h1 style="font-size:29px;font-weight:600;margin-top:6px;">How Avakin Report Works</h1>' +
      '<p style="font-size:14.5px;color:var(--slate);line-height:1.6;margin-top:12px;">Avakin Report is an independent editorial and community platform built around Avakin Life.</p>' +
      '<h2 style="font-size:20px;font-weight:500;margin-top:30px;">How It Works</h2>' + stepRows +
      '<div class="card" style="margin-top:22px;background:rgba(250,225,223,.2);"><p style="font-family:var(--serif);font-style:italic;font-size:16px;color:var(--navy);">&ldquo;Participation should have a paper trail.&rdquo;</p></div>' +
      '<h2 style="font-size:20px;font-weight:500;margin-top:30px;">Fair Voting</h2>' +
      '<p style="font-family:var(--serif);font-size:19px;font-weight:500;color:var(--navy);margin-top:8px;">One eligible player = one vote.</p>' +
      '<ul style="list-style:none;padding:0;margin-top:12px;">' + principleRows + '</ul>' +
      '<p style="font-size:12.5px;color:var(--slate);line-height:1.6;margin-top:16px;">This prototype has no real account system, so these principles are demonstrated in the interface rather than technically enforced.</p></div>' +
      footer();
  }

  /* ---------- render map + router ---------- */

  var currentVote = "next-up-october";
  var currentIdea = "outfit-folders";

  var renderers = {
    home: renderHome, vote: renderVoteHub,
    "vote-detail": function () { return renderVoteDetail(currentVote); },
    ideas: renderIdeas, "idea-detail": function () { return renderIdeaDetail(currentIdea); },
    impact: renderImpact, profile: renderProfile,
    transparency: renderTransparency, about: renderAbout
  };

  function go(view, opts) {
    opts = opts || {};
    if (opts.vote) currentVote = opts.vote;
    if (opts.idea) currentIdea = opts.idea;
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    var target = document.getElementById("view-" + view) || document.getElementById("view-home");
    target.innerHTML = "";
    target.appendChild(el('<div class="fade">' + renderers[view]() + "</div>"));
    target.classList.add("active");
    document.getElementById("scroller").scrollTop = 0;
    document.getElementById("menu").classList.remove("open");

    var tabKey = { "vote-detail": "vote", "idea-detail": "ideas" }[view] || view;
    document.querySelectorAll("#bottomnav button").forEach(function (b) {
      b.classList.toggle("active", b.getAttribute("data-tab") === tabKey);
    });
    wireView(view);
    location.hash = view === "vote-detail" ? "vote/" + currentVote : (view === "idea-detail" ? "ideas/" + currentIdea : view);
  }

  function wireView(view) {
    if (view === "vote-detail") {
      var list = document.getElementById("optList");
      if (list) {
        var multi = false;
        list.querySelectorAll(".option").forEach(function (opt) {
          opt.addEventListener("click", function () {
            if (!multi) list.querySelectorAll(".option").forEach(function (o) { o.classList.remove("selected"); o.querySelector(".dot").innerHTML = ""; });
            opt.classList.toggle("selected");
            opt.querySelector(".dot").innerHTML = opt.classList.contains("selected") ? checkIcon() : "";
            var any = list.querySelector(".option.selected");
            document.getElementById("submitVote").disabled = !any;
          });
        });
      }
      var submitBtn = document.getElementById("submitVote");
      if (submitBtn) {
        submitBtn.addEventListener("click", function () {
          var chosen = Array.prototype.map.call(list.querySelectorAll(".option.selected"), function (o) { return o.getAttribute("data-opt"); });
          if (!chosen.length) return;
          state.votes[currentVote] = chosen;
          saveState();
          go("vote-detail");
        });
      }
      var changeBtn = document.getElementById("changeVote");
      if (changeBtn) {
        changeBtn.addEventListener("click", function () {
          delete state.votes[currentVote];
          saveState();
          go("vote-detail");
        });
      }
    }

    if (view === "vote") {
      document.querySelectorAll("#view-vote .chiprow .chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          document.querySelectorAll("#view-vote .chiprow .chip").forEach(function (c) { c.classList.remove("active"); });
          chip.classList.add("active");
          filterVotes();
        });
      });
    }

    if (view === "ideas") {
      document.getElementById("ideaSearch").addEventListener("input", filterIdeas);
      document.querySelectorAll("#view-ideas .chiprow .chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          document.querySelectorAll("#view-ideas .chiprow .chip").forEach(function (c) { c.classList.remove("active"); });
          chip.classList.add("active");
          filterIdeas();
        });
      });
    }

    wireSupportButtons(view);
  }

  function wireSupportButtons(view, root) {
    root = root || document.querySelector(".view.active") || document;
    root.querySelectorAll(".supportBtn").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = btn.getAttribute("data-support");
        var idx = state.supported.indexOf(id);
        if (idx > -1) state.supported.splice(idx, 1); else state.supported.push(id);
        saveState();
        if (view === "ideas") filterIdeas(); else go(view);
      });
    });

    root.querySelectorAll("[data-go]").forEach(function (b) {
      b.addEventListener("click", function () {
        go(b.getAttribute("data-go"), { vote: b.getAttribute("data-vote"), idea: b.getAttribute("data-idea") });
      });
    });
    root.querySelectorAll("[data-toast]").forEach(function (b) {
      b.addEventListener("click", function () { toast(b.getAttribute("data-toast")); });
    });
  }

  function toast(msg) {
    var t = document.getElementById("toast");
    if (t) t.remove();
    t = el('<div id="toast" style="position:sticky;bottom:70px;margin:0 20px;padding:11px 16px;border-radius:12px;background:var(--navy);color:var(--off);font-size:13.5px;text-align:center;box-shadow:0 10px 30px rgba(13,31,45,.3);z-index:60;">' + msg + '</div>');
    document.getElementById("scroller").appendChild(t);
    setTimeout(function () { if (t.parentNode) t.remove(); }, 2200);
  }

  document.getElementById("menuBtn").addEventListener("click", function () {
    var menu = document.getElementById("menu");
    var open = menu.classList.toggle("open");
    this.setAttribute("aria-expanded", open);
  });

  document.querySelectorAll("[data-go]").forEach(function (b) {
    b.addEventListener("click", function () {
      go(b.getAttribute("data-go"), { vote: b.getAttribute("data-vote"), idea: b.getAttribute("data-idea") });
    });
  });

  /* ---------- init ---------- */
  var initial = (location.hash || "#home").slice(1).split("/");
  var initialView = "home";
  var initialOpts = {};
  if (initial[0] === "vote" && initial[1]) { initialView = "vote-detail"; initialOpts.vote = initial[1]; }
  else if (initial[0] === "ideas" && initial[1]) { initialView = "idea-detail"; initialOpts.idea = initial[1]; }
  else if (renderers[initial[0]]) { initialView = initial[0]; }
  go(initialView, initialOpts);
})();

</script>
